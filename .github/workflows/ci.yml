name: Iris Neural Network CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test model prediction
        run: |
          python -c "import joblib; m=joblib.load('models/iris_model.joblib')['model']; print('Prediction:', m.predict([[5.1, 3.5, 1.4, 0.2]])[0])"